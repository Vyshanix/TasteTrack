<div class="modal-header border-0 pb-0">
    <h6 class="modal-title fw-bold">{{ title }}</h6>
    <button type="button" class="btn-close small" data-bs-dismiss="modal"></button>
</div>
<div class="modal-body p-0">
    <div class="list-group list-group-flush">
        {% for u in users %}
            <a href="{% url 'profile' u.username %}" class="list-group-item list-group-item-action d-flex align-items-center justify-content-between px-3 py-2">
                <div class="d-flex align-items-center">
                    <div class="rounded-circle bg-dark text-white d-flex align-items-center justify-content-center me-3" style="width: 32px; height: 32px; font-size: 0.75rem; font-weight: bold;">
                        {{ u.username|first|upper }}
                    </div>
                    <span class="fw-bold small text-dark">@{{ u.username }}</span>
                </div>
                <span class="btn btn-sm btn-outline-dark rounded-pill py-0 px-2" style="font-size: 0.7rem;">View</span>
            </a>
        {% empty %}
            <div class="p-4 text-center text-muted small">No {{ title|lower }} yet.</div>
        {% endfor %}
    </div>
</div>
